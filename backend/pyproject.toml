[project]
name = "evalops-backend"
version = "0.1.0"
description = "EvalOps backend foundation (local infrastructure)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.114,<0.115",
  "uvicorn>=0.30,<0.31",
  "sqlalchemy>=2.0,<2.1",
  "pydantic>=2.0,<3.0",
  "asyncpg>=0.30,<0.31",
  "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2,<9.0",
  "ruff>=0.6,<1.0",
  "httpx>=0.27,<1.0",
  "alembic>=1.13,<2.0",
  "aiosqlite>=0.20,<0.21",
]

[project.scripts]
evalops-backend = "src.api.main:app"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = ["-q"]
