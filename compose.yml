services:
  postgres:
    image: postgres:16
    container_name: evalops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evalops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-evalops_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: evalops-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio
    container_name: evalops-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-replace-with-minio-access-key}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-replace-with-minio-secret-key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evalops-backend
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: INFO
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://evalops_user:replace-with-postgres-password@postgres:5432/evalops_local}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-replace-with-minio-access-key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-replace-with-minio-secret-key}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-evalops-dev}
    ports:
      - "8000:8000"
    command: ["uv", "run", "uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: evalops-web
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
